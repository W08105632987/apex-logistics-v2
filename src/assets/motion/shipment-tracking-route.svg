<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Shipment tracking route</title><desc id="desc">An abstract route line connects pickup, transit and destination milestones.</desc>
<defs><linearGradient id="line" x1="80" y1="180" x2="820" y2="180"><stop stop-color="#0891B2"/><stop offset="1" stop-color="#38BDF8"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="6"/></filter></defs>
<rect width="900" height="360" rx="24" fill="#F8FAFC"/><g stroke="#CBD5E1" stroke-opacity=".4" stroke-width="1"><path d="M0 60H900M0 120H900M0 180H900M0 240H900M0 300H900M90 0V360M180 0V360M270 0V360M360 0V360M450 0V360M540 0V360M630 0V360M720 0V360M810 0V360"/></g>
<path d="M90 180C180 180 170 95 280 95S390 265 500 265 620 140 710 140 790 180 810 180" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" stroke-opacity=".25"/><path d="M90 180C180 180 170 95 280 95S390 265 500 265 620 140 710 140 790 180 810 180" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 10"><animate attributeName="stroke-dashoffset" from="0" to="-80" dur="4s" repeatCount="indefinite"/></path>
<g><circle cx="90" cy="180" r="18" fill="#0891B2" fill-opacity=".14"><animate attributeName="r" values="18;27;18" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="90" cy="180" r="8" fill="#0E7490"/><circle cx="280" cy="95" r="7" fill="#0E7490"/><circle cx="500" cy="265" r="7" fill="#0E7490"/><circle cx="710" cy="140" r="7" fill="#0E7490"/><circle cx="810" cy="180" r="18" fill="#0284C7" fill-opacity=".13"><animate attributeName="r" values="18;27;18" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/></circle><circle cx="810" cy="180" r="8" fill="#0284C7"/></g>
<g fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600"><text x="58" y="222">PICKUP</text><text x="247" y="67">IN TRANSIT</text><text x="470" y="305">HUB SCAN</text><text x="678" y="112">OUT FOR DELIVERY</text><text x="768" y="222">ARRIVAL</text></g><g fill="#64748B" font-family="Inter,Arial,sans-serif" font-size="10" letter-spacing="2"><text x="30" y="32">SHIPMENT JOURNEY</text><text x="725" y="330">ILLUSTRATIVE ROUTE</text></g>
</svg>
