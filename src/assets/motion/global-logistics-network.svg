<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Global logistics network motion graphic</title><desc id="desc">Abstract world network with connected logistics hubs and animated cyan route pulses.</desc>
<defs>
 <linearGradient id="route" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#93C5FD" stroke-opacity=".10" stroke-width="1"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1200" height="620" rx="28" fill="#07182D"/><rect width="1200" height="620" rx="28" fill="url(#grid)"/>
<ellipse cx="610" cy="310" rx="470" ry="250" fill="url(#glow)"/>
<g stroke="#7DD3FC" stroke-opacity=".20" stroke-width="1.5"><ellipse cx="610" cy="310" rx="430" ry="170"/><ellipse cx="610" cy="310" rx="430" ry="170" transform="rotate(35 610 310)"/><ellipse cx="610" cy="310" rx="430" ry="170" transform="rotate(-35 610 310)"/><path d="M180 310H1040M250 220Q610 360 970 220M250 400Q610 260 970 400"/></g>
<g stroke="url(#route)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 13"><path d="M265 330Q390 150 520 255T760 210T960 325"/><path d="M265 330Q410 470 600 390T960 325"/><path d="M520 255Q560 320 600 390"/><path d="M760 210Q810 260 835 365"/></g>
<g fill="#22D3EE" opacity=".28" filter="url(#blur)"><circle cx="265" cy="330" r="24"/><circle cx="520" cy="255" r="24"/><circle cx="760" cy="210" r="24"/><circle cx="960" cy="325" r="24"/><circle cx="600" cy="390" r="24"/></g>
<g fill="#0B223D" stroke="#67E8F9" stroke-width="2.5"><circle cx="265" cy="330" r="9"/><circle cx="520" cy="255" r="9"/><circle cx="760" cy="210" r="9"/><circle cx="960" cy="325" r="9"/><circle cx="600" cy="390" r="9"/></g>
<g fill="#E0F2FE" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600"><text x="235" y="360">ORIGIN</text><text x="487" y="230">AIR HUB</text><text x="726" y="184">PORT</text><text x="924" y="355">DESTINATION</text><text x="564" y="424">DISTRIBUTION</text></g>
<g fill="#22D3EE"><circle r="5"><animateMotion dur="5.5s" repeatCount="indefinite" path="M265 330Q390 150 520 255T760 210T960 325"/></circle><circle r="4"><animateMotion dur="6.8s" begin="-2.2s" repeatCount="indefinite" path="M265 330Q410 470 600 390T960 325"/></circle><circle r="3.5"><animateMotion dur="4.7s" begin="-1.4s" repeatCount="indefinite" path="M520 255Q560 320 600 390"/></circle></g>
<g fill="#93C5FD" fill-opacity=".8" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="3"><text x="48" y="58">APEX / CONNECTED OPERATIONS</text><text x="48" y="580">LIVE ROUTE CONCEPT • ILLUSTRATIVE GRAPHIC</text></g>
</svg>
