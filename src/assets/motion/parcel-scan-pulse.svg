<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Parcel scan pulse</title><desc id="desc">A parcel icon with a scanning beam and pulsing tracking signal.</desc>
<defs><linearGradient id="box" x1="70" y1="50" x2="250" y2="180"><stop stop-color="#0E7490"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter></defs>
<circle cx="160" cy="108" r="78" fill="#22D3EE" fill-opacity=".06" stroke="#67E8F9" stroke-opacity=".24"/><circle cx="160" cy="108" r="59" stroke="#22D3EE" stroke-opacity=".28" stroke-dasharray="3 7"><animateTransform attributeName="transform" type="rotate" from="0 160 108" to="360 160 108" dur="18s" repeatCount="indefinite"/></circle>
<path d="M105 80L160 53 215 80 160 108 105 80Z" fill="#BAE6FD"/><path d="M105 80V140L160 170V108L105 80Z" fill="#0E7490"/><path d="M215 80V140L160 170V108L215 80Z" fill="url(#box)"/><path d="M160 108V170M132 66L187 94" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round"/><path d="M91 112H229" stroke="#22D3EE" stroke-width="8" stroke-opacity=".25" filter="url(#glow)"/><path d="M91 112H229" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"><animate attributeName="y1" values="70;145;70" dur="3.2s" repeatCount="indefinite"/><animate attributeName="y2" values="70;145;70" dur="3.2s" repeatCount="indefinite"/></path>
<circle cx="229" cy="112" r="4" fill="#67E8F9"><animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/></circle>
</svg>
